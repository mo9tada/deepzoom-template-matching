name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `next build` generates next-env.d.ts (image/CSS module types) and
      # type-checks the app, so it must run before the standalone tsc pass.
      - name: Production build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit

  matcher:
    name: Matcher (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-matcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-matcher/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + API tests
        run: pytest -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: matcher
    steps:
      - uses: actions/checkout@v5
      - name: Build matcher image
        run: docker build -t deepzoom-matcher ./python-matcher
